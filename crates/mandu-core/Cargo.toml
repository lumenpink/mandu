[package]
name = "mandu-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Núcleo de domínio, cofre, indexador SQLite (FTS5) e resolvedor de notas para o Mandu"

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
blake3 = "1.5"
notify = "8.0"
walkdir = "2.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
pulldown-cmark = "0.12"
nucleo = "0.5"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
joaju = { path = "../../../joaju" }

[dev-dependencies]
tempfile = "3.17"
