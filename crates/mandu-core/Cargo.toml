[package]
name = "mandu-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Núcleo de domínio, cofre, indexador SQLite (FTS5) e resolvedor de notas para o Mandu"

[features]
default = ["storage-local"]
storage-local = ["dep:rusqlite", "dep:notify", "dep:walkdir", "dep:rayon"]

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"], optional = true }
blake3 = "1.5"
notify = { version = "8.0", optional = true }
walkdir = { version = "2.5", optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
pulldown-cmark = "0.12"
nucleo = "0.5"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
joaju-refs = { version = "=0.1.0-dev.12", registry = "gambi" }
joaju = { version = "=0.2.0-dev.138", registry = "gambi", default-features = false, path = "../../../joaju" }

[dev-dependencies]
tempfile = "3.17"
