[package]
name = "mandu-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Interface de Terminal (Ratatui) para o Mandu"

[dependencies]
mandu-core = { path = "../mandu-core" }
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[lib]
name = "mandu_tui"
path = "src/lib.rs"

[[bin]]
name = "mandu-tui"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
