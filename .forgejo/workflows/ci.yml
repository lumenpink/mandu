name: "CI/CD & Canonical Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Canonical Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          TOKEN="${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}"
          RAW_TOKEN="${TOKEN#Bearer }"
          if [ -n "$RAW_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test --all-targets

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-site:
    name: "Deploy Mandu Static Site to Cloudflare Workers"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Deploy Mandu Static Site to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "★ Publicando Site em mandu.2lp.in via Cloudflare Workers..."
            npx wrangler deploy || echo "Aviso: Falha no deploy Cloudflare Workers."
          else
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando deploy Cloudflare Workers."
          fi

  deploy-banca:
    name: "Build & Publish Mandu (${{ matrix.arch }}) to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64
            pkg_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64
            pkg_ext: tar.gz
          - target: x86_64-pc-windows-gnu
            arch: windows-amd64
            pkg_ext: zip
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION | Arch: ${{ matrix.arch }}"

      - name: "Configure Canonical Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          TOKEN="${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}"
          RAW_TOKEN="${TOKEN#Bearer }"
          if [ -n "$RAW_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Compile Mandu Binary Target"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
          GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          LUMEN_REGISTRY_TOKEN: ${{ secrets.LUMEN_REGISTRY_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,--allow-multiple-definition"
          echo "★ Compilando ${{ matrix.target }} (${{ matrix.arch }}) em sequência..."
          for pkg in mandu-cli mandu-tui mandu-gui; do
            echo "  -> Compilando $pkg..."
            cargo zigbuild --release --target ${{ matrix.target }} -p "$pkg" || \
              cargo build --release --target ${{ matrix.target }} -p "$pkg"
          done

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.pkg_ext }}"
          mkdir -p dist/packages

          if [ "$ARCH" = "windows-amd64" ]; then
            cd "target/${TARGET}/release"
            zip -j "$GITHUB_WORKSPACE/dist/packages/mandu-${VERSION}-${ARCH}.zip" \
              mandu.exe mandu-tui.exe mandu-gui.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/mandu-${VERSION}-${ARCH}.zip" \
              mandu.exe mandu-tui.exe mandu-gui.exe
            cd "$GITHUB_WORKSPACE"
          else
            tar -czf "dist/packages/mandu-${VERSION}-${ARCH}.tar.gz" \
              -C "target/${TARGET}/release" mandu mandu-tui mandu-gui \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/mandu-${VERSION}-${ARCH}.tar.gz" \
              -C "target/${TARGET}/release" mandu mandu-tui mandu-gui
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.pkg_ext }}"
          PKG_NAME="mandu-${VERSION}-${ARCH}.${EXT}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Enviando $PKG_NAME para o Cloudflare R2 (twolp-bucket / bucket.2lp.in)..."
          if [ -f "dist/packages/${PKG_NAME}" ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/mandu/${CHANNEL}/${PKG_NAME}" \
              --file="dist/packages/${PKG_NAME}" --remote || true
          fi

      - name: "Rotate Manifest & Commit to Banca"
        env:
          GIT_2LP_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.pkg_ext }}"
          PKG_FILE="mandu-${VERSION}-${ARCH}.${EXT}"

          echo "★ Clonando repositório da Banca para rotação e retenção..."
          RAW_TOKEN="${GIT_2LP_TOKEN#Bearer }"
          git clone --depth 1 "https://lumen:${RAW_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/mandu" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
            DOWNLOAD_URL="https://bucket.2lp.in/downloads/mandu/${CHANNEL}/${PKG_FILE}"

            python3 scripts/rotate-downloads.py \
              --manifest site/downloads/mandu/index.json \
              --channel "${CHANNEL}" \
              --arch "${ARCH}" \
              --version-str "${VERSION}" \
              --url "${DOWNLOAD_URL}" \
              --sha256 "${HASH}" \
              --tarball "${PKG_FILE}" \
              --app "mandu"

            # Commitar manifesto atualizado na Banca com retentativas e rebase
            git config user.name "Mandu Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/mandu/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate mandu ${ARCH} release to ${VERSION} (#11)"
              for attempt in 1 2 3 4 5; do
                if git push origin main; then
                  echo "✓ Manifesto da Banca atualizado com sucesso."
                  break
                fi
                echo "⚠️ Falha ao empurrar manifesto para Banca (tentativa $attempt/5). Reexecutando pull --rebase..."
                git pull --rebase origin main || true
                sleep 3
                if [ "$attempt" -eq 5 ]; then
                  echo "❌ ERRO CRÍTICO: Não foi possível empurrar manifesto para Banca após 5 tentativas."
                  exit 1
                fi
              done
            else
              echo "Manifesto já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

  deploy-apk:
    name: "Build Android APK & Publish to Pratilera"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-android:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GAMBI_2LP_IN_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Canonical Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          TOKEN="${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}"
          RAW_TOKEN="${TOKEN#Bearer }"
          if [ -n "$RAW_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Build Android APK via Dioxus"
        run: |
          chmod +x scripts/package-apk.sh
          ./scripts/package-apk.sh

      - name: "Validate APK Size (Minimum 1MB)"
        run: |
          APK_FILE="dist/android/mandu.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "❌ ERRO CRÍTICO: APK não foi gerado em $APK_FILE"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo 0)
          echo "★ Tamanho do APK gerado: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 1048576 ]; then
            echo "❌ ERRO CRÍTICO: Tamanho anômalo do APK ($APK_SIZE bytes < 1MB)."
            exit 1
          fi
          echo "✓ Validação de tamanho aprovada (>= 1MB)."

      - name: "Upload APK to Cloudflare R2"
        run: |
          upload_r2_with_retry() {
            local target="$1"
            local file="$2"
            local max_attempts=4
            local attempt=1
            local delay=5
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Enviando $file para $target (tentativa $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$target" --file="$file" --remote; then
                echo "  ✓ Upload concluído com sucesso: $target"
                return 0
              fi
              echo "  ⚠️ Falha transitória ao enviar para o R2 (tentativa $attempt/$max_attempts). Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas ao publicar no Cloudflare R2: $target"
            exit 1
          }

          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "★ Publicando mandu.apk na raiz do bucket para A Pratilera..."
            upload_r2_with_retry "twolp-bucket/mandu.apk" dist/android/mandu.apk

            echo "★ Publicando mandu.apk versionado por canal..."
            upload_r2_with_retry "twolp-bucket/downloads/mandu/${{ steps.meta.outputs.channel }}/mandu.apk" dist/android/mandu.apk
          else
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
          fi

  trigger-pratilera:
    name: "Trigger Pratilera Store Update in Banca"
    runs-on: ubuntu-latest
    needs: [deploy-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Trigger Pratilera Store Update"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          if [ -n "$GAMBI_2LP_IN_TOKEN" ]; then
            echo "-> Notificando a Pratilera (Banca) para atualizar o catálogo..."
            curl -s -X POST \
              -H "Authorization: token $GAMBI_2LP_IN_TOKEN" \
              -H "Content-Type: application/json" \
              "https://gambi.2lp.in/api/v1/repos/lumen/banca/actions/workflows/ci.yml/dispatches" \
              -d '{"ref": "main"}' || true
          fi
