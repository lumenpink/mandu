[workspace]
members = [
    "crates/mandu-core",
    "crates/mandu-tui",
    "crates/mandu-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.385+20261109.58321c9"
edition = "2021"
authors = ["Lumen Pink <hi@lumen.pink>"]
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/lumenpink/mandu"
homepage = "https://mandu.2lp.in"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
