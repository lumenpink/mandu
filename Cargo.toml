[workspace]
members = [
    "crates/mandu-core",
    "crates/mandu-tui",
    "crates/mandu-gui",
    "crates/mandu-cli",
    "crates/mandu-mobile",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2021"
authors = ["Lumen Pink <hi@lumen.pink>"]
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/lumenpink/mandu"
homepage = "https://mandu.2lp.in"

[workspace.lints.rust]
unsafe_code = "forbid"

